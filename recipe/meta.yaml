{% set name = "spyx" %}
{% set version = "1.0.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/spyx-{{ version }}.tar.gz
  sha256: ae5fb31de414e12a3ff3f733874c273b994159ee838c9223dadf0c870c878c3e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - hatchling
  run:
    - python >={{ python_min }}
    - dm-haiku
    - optax
    - jax-tqdm
    - nir
    - grain

test:
  imports:
    - spyx
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/kmheckel/spyx
  summary: 'Spyx: SNNs in JAX'
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
